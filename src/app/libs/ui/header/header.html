<header
  class="sticky top-0 z-40 h-[60px] flex items-center justify-between border-b border-gray-200 bg-white/90 px-4 py-3 backdrop-blur [html.dark_&]:border-gray-700 [html.dark_&]:bg-gray-900/90"
>
  <div class="flex items-center gap-3">
    <app-menu></app-menu>
    <h1 class="text-lg font-semibold">Flash Card</h1>
  </div>

  <button
    type="button"
    class="rounded-md border border-gray-300 px-3 py-1.5 text-sm font-medium hover:bg-gray-100 [html.dark_&]:border-gray-600 [html.dark_&]:hover:bg-gray-800"
    (click)="toggleTheme()"
  >
    {{ isDark() ? '☀️ Light' : '🌙 Dark' }}
  </button>
</header>
