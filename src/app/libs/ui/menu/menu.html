<div class="relative">
  <button
    type="button"
    class="flex h-10 w-10 cursor-pointer flex-col justify-center gap-1.5 rounded-md p-1.5 hover:bg-gray-100 [html.dark_&]:hover:bg-gray-800"
    (click)="toggleMenu()"
    [attr.aria-expanded]="isOpen()"
    aria-label="Toggle navigation menu"
  >
    <span class="block h-0.5 w-full bg-gray-900 [html.dark_&]:bg-gray-100"></span>
    <span class="block h-0.5 w-full bg-gray-900 [html.dark_&]:bg-gray-100"></span>
    <span class="block h-0.5 w-full bg-gray-900 [html.dark_&]:bg-gray-100"></span>
  </button>

  <nav
    class="fixed left-0 top-[60px] z-50 min-w-[200px] flex-col border border-gray-200 bg-white p-1 shadow-lg [html.dark_&]:border-gray-700 [html.dark_&]:bg-gray-900"
    [class.hidden]="!isOpen()"
    [class.flex]="isOpen()"
  >
    <a
      routerLink="/dashboard"
      class="rounded-md px-3 py-2 font-medium text-gray-900 hover:bg-gray-50 [html.dark_&]:text-gray-100 [html.dark_&]:hover:bg-gray-800"
      (click)="closeMenu()"
    >
      DashBoard
    </a>
    <a
      routerLink="/flash-card"
      class="rounded-md px-3 py-2 font-medium text-gray-900 hover:bg-gray-50 [html.dark_&]:text-gray-100 [html.dark_&]:hover:bg-gray-800"
      (click)="closeMenu()"
    >
      FlashCard
    </a>
  </nav>
</div>
