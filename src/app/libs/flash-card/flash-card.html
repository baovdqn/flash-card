<section class="mx-auto w-full max-w-5xl">
  <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
    <h2
      id="folders-heading"
      class="text-xl font-semibold text-gray-900 [html.dark_&]:text-gray-100"
    >
      Folders
    </h2>

    <div class="flex gap-2" role="group" aria-labelledby="folders-heading">
      <button
        type="button"
        class="rounded border border-blue-600 px-2 py-1 text-sm font-medium text-white :hover:cursor-pointer"
      >
        Import Folder
      </button>
      <button
        type="button"
        class="rounded border border-green-600 px-2 py-1 text-sm font-medium text-white :hover:cursor-pointer"
      >
        + Create Folder
      </button>
    </div>
  </div>

  <app-folder></app-folder>
</section>
