<div class="flex flex-col gap-3">
  @for (folder of folders; track folder.name) {
    <div class="overflow-hidden rounded-lg border border-gray-200 [html.dark_&]:border-gray-700">
      <div
        class="flex items-center justify-between border-b border-gray-200 px-4 py-3 last:border-b-0 [html.dark_&]:border-gray-700"
      >
        <div>
          <h3 class="font-medium text-gray-900 [html.dark_&]:text-gray-100">{{ folder.name }}</h3>
          <p class="text-sm text-gray-500 [html.dark_&]:text-gray-400">
            {{ folder.totalWords }} vocabulary words
          </p>
          <div
            class="mt-2 h-2 w-full overflow-hidden rounded-full bg-gray-200 [html.dark_&]:bg-gray-600"
          >
            <div class="h-full bg-blue-500" [style.width.%]="folder.progress * 100"></div>
          </div>
        </div>
        <span class="text-xs text-gray-500 [html.dark_&]:text-gray-400">{{
          folder.updatedAt
        }}</span>
      </div>
    </div>
  }
</div>
