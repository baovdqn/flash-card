<div class="grid gap-3 sm:gap-4">
  <div class="w-full max-w-full sm:max-w-[440px]">
    <div
      class="flashcard relative min-h-[260px] rounded-xl border border-gray-200 bg-white p-4 shadow-sm sm:min-h-[280px] sm:p-5 [html.dark_&]:border-gray-700 [html.dark_&]:bg-gray-900"
      (click)="flipCard()"
    >
      <div class="flashcard-inner" [class.is-back]="isBackSide()">
        <div class="flashcard-face flashcard-front">
          <div class="flex min-h-[220px] items-center justify-center sm:min-h-[240px]">
            <h3
              class="m-0 text-center text-2xl font-bold text-gray-900 sm:text-3xl [html.dark_&]:text-gray-100"
            >
              {{ currentCard()?.name }}
            </h3>
            <button
              type="button"
              (click)="playPronunciation($event)"
              class="absolute right-3 top-3 inline-flex items-center justify-center rounded-full border border-blue-500 p-2 text-blue-600 hover:bg-blue-50 sm:right-[30px] sm:top-[30px] sm:px-3 sm:py-1.5 [html.dark_&]:border-blue-400 [html.dark_&]:text-blue-300 [html.dark_&]:hover:bg-blue-900/30"
              aria-label="Play pronunciation"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 -960 960 960"
                class="h-4 w-4 sm:h-4 sm:w-4"
                fill="currentColor"
              >
                <path
                  d="M560-131v-82q90-26 145-100t55-167q0-94-55-168t-145-99v-82q124 27 202 125.5T840-480q0 148-78 246.5T560-131ZM160-360v-240h160l200-200v640L320-360H160Zm400 80v-400q55 24 87.5 76.5T680-480q0 71-32.5 123.5T560-280Z"
                />
              </svg>
            </button>
          </div>
        </div>

        <div class="flashcard-face flashcard-back">
          <div class="mt-2 space-y-2 sm:mt-4 sm:space-y-3">
            <div class="border-b border-gray-200 p-2.5 sm:p-3 [html.dark_&]:border-gray-700">
              <p
                class="text-xs font-medium uppercase text-center text-gray-500 [html.dark_&]:text-gray-400"
              >
                Meaning
              </p>
              <p
                class="mt-1 text-center text-sm text-gray-900 sm:text-base [html.dark_&]:text-gray-100"
              >
                {{ currentCard()?.meaning }}
              </p>
            </div>

            <div class="border-b border-gray-200 p-2.5 sm:p-3 [html.dark_&]:border-gray-700">
              <p
                class="text-xs font-medium uppercase text-center text-gray-500 [html.dark_&]:text-gray-400"
              >
                Phonetic
              </p>
              <p
                class="mt-1 text-center text-sm text-gray-900 sm:text-base [html.dark_&]:text-gray-100"
              >
                {{ currentCard()?.phonetic || '-' }}
              </p>
            </div>

            @if (currentCard()?.imageUrl) {
              <div
                class="overflow-hidden rounded-lg border border-gray-200 [html.dark_&]:border-gray-700"
              >
                <img
                  [src]="currentCard()?.imageUrl"
                  [alt]="(currentCard()?.name || 'word') + ' image'"
                  class="h-24 w-full object-cover sm:h-28"
                  loading="lazy"
                />
              </div>
            }
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="flex gap-2">
    <button
      class="flex-1 rounded-md border border-red-500 bg-transparent px-3 py-2 text-sm font-semibold text-red-500 hover:bg-red-100"
      (click)="rateHard()"
    >
      Hard
    </button>
    <button
      type="button"
      class="flex-1 rounded-md border border-amber-500 bg-transparent px-3 py-2 text-sm font-semibold text-amber-600 hover:bg-amber-100"
      (click)="rateMedium()"
    >
      Medium
    </button>
    <button
      type="button"
      class="flex-1 rounded-md border border-green-500 bg-transparent px-3 py-2 text-sm font-semibold text-green-500 hover:bg-green-100"
      (click)="rateEasy()"
    >
      Easy
    </button>
  </div>
</div>
